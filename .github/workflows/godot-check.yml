name: Godot project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Import and smoke-test project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import project and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          IMPORT_LOG="$RUNNER_TEMP/worlds-import.log"
          if ! godot --headless --editor --path . --quit >"$IMPORT_LOG" 2>&1; then
            cat "$IMPORT_LOG"
            exit 1
          fi
          cat "$IMPORT_LOG"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$IMPORT_LOG"; then
            exit 1
          fi

      - name: Run main scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          SCENE_LOG="$RUNNER_TEMP/worlds-scene.log"
          if ! godot --headless --path . --quit-after 60 >"$SCENE_LOG" 2>&1; then
            cat "$SCENE_LOG"
            exit 1
          fi
          cat "$SCENE_LOG"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$SCENE_LOG"; then
            exit 1
          fi

      - name: Exercise LAN host and client processes
        shell: bash
        run: |
          set -euo pipefail
          HOST_LOG="$RUNNER_TEMP/worlds-lan-host.log"
          CLIENT_LOG="$RUNNER_TEMP/worlds-lan-client.log"
          godot --headless --path . -- --lan-smoke-host >"$HOST_LOG" 2>&1 &
          HOST_PID=$!
          cleanup() {
            kill "$HOST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          HOST_READY=false
          for attempt in $(seq 1 30); do
            if grep -q "LAN_SMOKE_HOST_READY" "$HOST_LOG"; then
              HOST_READY=true
              break
            fi
            if ! kill -0 "$HOST_PID" 2>/dev/null; then
              cat "$HOST_LOG"
              exit 1
            fi
            sleep 0.25
          done
          if [ "$HOST_READY" != "true" ]; then
            cat "$HOST_LOG"
            exit 1
          fi

          godot --headless --path . -- --lan-smoke-client >"$CLIENT_LOG" 2>&1 &
          CLIENT_PID=$!

          if ! wait "$HOST_PID"; then
            cat "$HOST_LOG"
            cat "$CLIENT_LOG"
            exit 1
          fi
          if ! wait "$CLIENT_PID"; then
            cat "$HOST_LOG"
            cat "$CLIENT_LOG"
            exit 1
          fi

          cat "$HOST_LOG"
          cat "$CLIENT_LOG"
          grep -q "LAN_SMOKE_HOST_PASS" "$HOST_LOG"
          grep -q "LAN_SMOKE_CLIENT_PASS" "$CLIENT_LOG"
